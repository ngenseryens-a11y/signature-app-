<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EZSign｜電子簽名</title>
<!-- LINE / 社群平台預覽卡片設定 -->
<meta property="og:title"       content="EZSign 電子簽名">
<meta property="og:description" content="手機直接簽名，支援 PDF、圖片，簽名後自動加上日期浮水印，高解析度輸出。">
<meta property="og:type"        content="website">
<meta name="description"        content="手機直接簽名，支援 PDF、圖片，簽名後自動加上日期浮水印，高解析度輸出。">
<meta name="application-name"   content="EZSign">
<meta name="author"             content="EZSign">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500&display=swap');
:root{
  --ink:#1a1a2e;--paper:#f5f0e8;--accent:#8b1a1a;
  --gold:#c9a84c;--muted:#7a7265;--line:#d4cfc6;
  --shadow:rgba(26,26,46,0.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}

/* 頂部 */
header{width:100%;background:var(--ink);padding:18px 24px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(201,168,76,0.3);}
.logo-mark{width:40px;height:36px;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Noto Serif TC',serif;font-size:13px;color:var(--gold);font-weight:900;letter-spacing:1px;}
header h1{font-family:'Noto Serif TC',serif;color:var(--paper);font-size:17px;font-weight:600;letter-spacing:2px;}
header span{margin-left:auto;font-size:11px;color:var(--muted);}

/* 步驟列 */
.steps{width:100%;max-width:480px;display:flex;padding:16px 20px 0;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;}
.step:not(:last-child)::after{content:'';position:absolute;top:14px;left:55%;width:90%;height:1px;background:var(--line);opacity:0.3;}
.step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all .3s;}
.step-circle.done{background:var(--gold);color:var(--ink);}
.step-circle.active{background:var(--accent);color:#fff;box-shadow:0 0 0 3px rgba(139,26,26,.3);}
.step-circle.idle{background:rgba(255,255,255,.1);color:var(--muted);}
.step-label{font-size:10px;color:var(--muted);letter-spacing:.5px;text-align:center;}

main{width:100%;max-width:480px;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px;}
.card{background:var(--paper);border-radius:4px;overflow:hidden;box-shadow:0 4px 24px var(--shadow);}
.card-title{background:var(--ink);color:var(--gold);font-family:'Noto Serif TC',serif;font-size:12px;letter-spacing:3px;padding:10px 16px;display:flex;align-items:center;gap:8px;}

/* 上傳 */
.upload-zone{margin:16px;padding:28px 20px;border:2px dashed var(--line);border-radius:2px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;position:relative;}
.upload-zone input[type="file"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2;}
.upload-icon{font-size:40px;pointer-events:none;}
.upload-text{font-size:13px;color:var(--muted);text-align:center;line-height:1.8;pointer-events:none;}
.upload-fake-btn{background:var(--ink);color:var(--gold);border:1px solid var(--gold);padding:8px 20px;font-size:12px;letter-spacing:2px;pointer-events:none;}
#file-chip-row{display:none;align-items:center;gap:10px;margin:12px 16px 0;background:white;padding:10px 14px;border-left:3px solid var(--gold);}
#file-chip-row .ficon{font-size:22px;}
#file-chip-row .finfo{flex:1;}
#file-chip-row .fname{font-size:13px;font-weight:500;color:var(--ink);word-break:break-all;}
#file-chip-row .fsize{font-size:11px;color:var(--muted);}
#file-chip-row .fremove{font-size:20px;color:var(--muted);cursor:pointer;padding:4px 8px;}
#doc-preview-box{display:none;margin:12px 16px 16px;flex-direction:column;gap:6px;}
.preview-label{font-size:11px;color:var(--muted);letter-spacing:1px;}
#doc-preview-img{width:100%;border:1px solid var(--line);border-radius:2px;display:none;}
#pdf-pages-wrap{display:none;flex-direction:column;gap:8px;}
.pdf-page-item{display:flex;flex-direction:column;gap:4px;}
.pdf-page-item canvas{width:100%;border:1px solid var(--line);border-radius:2px;display:block;}
.pdf-page-label{font-size:11px;color:var(--muted);text-align:center;letter-spacing:1px;}
#loading-bar{display:none;padding:16px;text-align:center;font-size:13px;color:var(--muted);}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 簽名板 */
.sig-board-wrap{padding:16px;display:flex;flex-direction:column;gap:10px;}
.pen-options{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pen-label{font-size:11px;color:var(--muted);min-width:40px;}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;flex-shrink:0;}
.color-dot.active{border-color:var(--gold);transform:scale(1.25);}
.size-btn{background:none;border:1px solid var(--line);padding:4px 10px;font-size:11px;cursor:pointer;color:var(--muted);border-radius:2px;font-family:'Noto Sans TC',sans-serif;}
.size-btn.active{background:var(--ink);color:var(--gold);border-color:var(--ink);}
#sig-canvas{
  background:white;border:1px solid var(--line);border-radius:2px;display:block;
  width:100%;height:160px;
  touch-action:none;        /* 阻止瀏覽器預設觸控行為（滾動、縮放）*/
  cursor:crosshair;
  -webkit-user-select:none; /* iOS：阻止文字選取 */
  user-select:none;
  -webkit-touch-callout:none; /* iOS：阻止長按選單 */
  -webkit-tap-highlight-color:transparent; /* iOS：阻止點擊高亮 */
}
.sig-hint{font-size:11px;color:var(--muted);text-align:center;}
.sig-actions{display:flex;gap:6px;}
.btn-undo{padding:11px 14px;background:none;border:1px solid var(--line);font-size:18px;cursor:pointer;color:var(--muted);flex-shrink:0;}
.btn-undo:disabled{opacity:0.3;cursor:not-allowed;}
.btn-ghost{flex:1;padding:11px;background:none;border:1px solid var(--line);font-size:12px;letter-spacing:1px;color:var(--muted);cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
.btn-primary{flex:2;padding:11px;background:var(--accent);border:none;color:white;font-size:12px;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:500;}
.btn-primary:disabled{background:var(--line);color:#aaa;cursor:not-allowed;}

#sig-saved-row{display:none;margin:0 16px 16px;align-items:center;gap:12px;background:white;padding:10px 12px;border:1px solid var(--line);border-radius:2px;}
#sig-thumb{height:48px;max-width:120px;object-fit:contain;}
#sig-saved-row .sinfo{flex:1;}
#sig-saved-row .sinfo strong{font-size:13px;color:var(--ink);}
#sig-saved-row .sinfo p{font-size:11px;color:var(--muted);}
.re-sign-btn{font-size:11px;color:var(--accent);background:none;border:1px solid var(--accent);padding:5px 10px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}

/* 放置頁面 */
#card-place{display:none;}
.place-hint{padding:10px 16px;font-size:12px;color:var(--accent);background:rgba(139,26,26,.06);}

/* PDF多頁選頁器 */
#pdf-page-selector{display:none;padding:12px 16px;flex-direction:column;gap:8px;}
.page-sel-title{font-size:12px;color:var(--ink);font-weight:500;letter-spacing:1px;}
.page-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.page-tab{background:none;border:1px solid var(--line);padding:6px 12px;font-size:12px;cursor:pointer;color:var(--muted);border-radius:2px;font-family:'Noto Sans TC',sans-serif;transition:all .15s;}
.page-tab.active{background:var(--accent);color:white;border-color:var(--accent);}
.page-tab.signed{border-color:var(--gold);color:var(--gold);}
.page-tab.signed.active{background:var(--gold);color:var(--ink);}
.page-nav-row{display:flex;gap:8px;align-items:center;}
.page-nav-info{font-size:12px;color:var(--muted);flex:1;text-align:center;}

#doc-place-wrap{margin:12px 16px;position:relative;background:white;border:1px solid var(--line);border-radius:2px;overflow:hidden;min-height:160px;}
#doc-place-img{width:100%;display:none;}
#doc-place-pdfcanvas{width:100%;display:none;}

/* 簽名貼圖 */
.sig-sticker{position:absolute;cursor:move;user-select:none;touch-action:none;}
.sig-sticker img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
.sticker-border{position:absolute;inset:-3px;border:2px dashed var(--accent);border-radius:2px;pointer-events:none;}
.sticker-border.date-type{border-color:var(--gold);}
.del-btn{position:absolute;top:-13px;right:-13px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;cursor:pointer;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.resize-btn{position:absolute;bottom:-11px;right:-11px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:se-resize;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.3);}

.place-btn-row{display:flex;gap:8px;margin:0 16px 16px;}
#prev-page-btn,#next-page-btn{flex:1;padding:10px;background:none;border:1px solid var(--line);font-size:12px;cursor:pointer;color:var(--muted);font-family:'Noto Sans TC',sans-serif;}
#prev-page-btn:disabled,#next-page-btn:disabled{opacity:0.3;cursor:not-allowed;}
#place-confirm-btn{flex:2;padding:10px;background:var(--accent);border:none;color:white;font-size:12px;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:500;}

/* 下載 */
#card-export{display:none;}
.export-wrap{padding:16px;display:flex;flex-direction:column;gap:12px;}
.export-info{font-size:13px;color:var(--ink);background:rgba(201,168,76,.15);border-left:3px solid var(--gold);padding:12px;line-height:1.9;}
#result-pages-wrap{display:none;flex-direction:column;gap:16px;}
.result-page-block{display:flex;flex-direction:column;gap:6px;}
.result-page-title{font-size:11px;color:var(--muted);letter-spacing:1px;}
.result-page-img{width:100%;border:2px solid var(--gold);border-radius:2px;display:block;}
.save-hint{font-size:13px;color:var(--ink);background:rgba(201,168,76,.15);border-left:3px solid var(--gold);padding:12px;line-height:1.9;}
.btn-restart{width:100%;padding:11px;background:none;border:1px solid var(--line);font-size:12px;letter-spacing:1px;color:var(--muted);cursor:pointer;font-family:'Noto Sans TC',sans-serif;}

#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--gold);padding:10px 22px;border:1px solid var(--gold);font-size:12px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:999;white-space:nowrap;max-width:90vw;text-align:center;}
#toast.show{opacity:1;}
#merge-canvas{display:none;}
</style>
</head>
<body>

<header>
  <div class="logo-mark">EZ</div>
  <h1>EZSign</h1>
  <span>v1.4</span>
</header>

<div class="steps">
  <div class="step"><div class="step-circle active" id="s1">1</div><div class="step-label">上傳</div></div>
  <div class="step"><div class="step-circle idle" id="s2">2</div><div class="step-label">簽名</div></div>
  <div class="step"><div class="step-circle idle" id="s3">3</div><div class="step-label">放置</div></div>
  <div class="step"><div class="step-circle idle" id="s4">4</div><div class="step-label">儲存</div></div>
</div>

<main>

<!-- ① 上傳 -->
<div class="card" id="card-upload">
  <div class="card-title">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    步驟一｜選擇要簽名的文件
  </div>
  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/gif,image/webp,.pdf,application/pdf">
    <div class="upload-icon">📄</div>
    <div class="upload-text">支援 JPG、PNG 圖片 及 PDF 文件<br>點此選擇文件</div>
    <div class="upload-fake-btn">選擇文件</div>
  </div>
  <div id="file-chip-row">
    <div class="ficon" id="file-icon-el">📄</div>
    <div class="finfo">
      <div class="fname" id="file-name-el">—</div>
      <div class="fsize" id="file-size-el">—</div>
    </div>
    <div class="fremove" onclick="removeFile()">✕</div>
  </div>
  <div id="doc-preview-box">
    <div class="preview-label">▸ 文件預覽（確認無誤後，點下方按鈕簽名）</div>
    <img id="doc-preview-img" src="" alt="">
    <div id="loading-bar"><span class="spinner"></span>PDF 載入中，請稍候…</div>
    <div id="pdf-pages-wrap"></div>
    <button id="go-sign-btn" style="display:none;width:100%;padding:12px;margin-top:8px;background:var(--accent);border:none;color:white;font-size:13px;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-weight:500;"
      onclick="document.getElementById('card-sign').scrollIntoView({behavior:'smooth',block:'start'})">
      ▼ 確認預覽，前往手寫簽名
    </button>
  </div>
</div>

<!-- ② 簽名 -->
<div class="card" id="card-sign">
  <div class="card-title">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
    步驟二｜在下方手寫簽名
  </div>
  <div class="sig-board-wrap">
    <div class="pen-options">
      <span class="pen-label">筆色</span>
      <div class="color-dot active" style="background:#1a1a2e" data-color="#1a1a2e" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#8b1a1a" data-color="#8b1a1a" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#1a3a8b" data-color="#1a3a8b" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#1a7a3a" data-color="#1a7a3a" onclick="setColor(this)"></div>
      <span class="pen-label" style="margin-left:6px">粗細</span>
      <button class="size-btn" data-size="2" onclick="setSize(this)">細</button>
      <button class="size-btn active" data-size="4" onclick="setSize(this)">中</button>
      <button class="size-btn" data-size="7" onclick="setSize(this)">粗</button>
    </div>
    <canvas id="sig-canvas"></canvas>
    <div class="sig-hint">用手指在上方白色區域書寫簽名</div>
    <div class="sig-actions">
      <button class="btn-undo" id="undo-btn" onclick="undoStroke()" disabled title="上一步">↩</button>
      <button class="btn-ghost" onclick="clearSig()">全部清除</button>
      <button class="btn-primary" id="apply-btn" onclick="applySig()" disabled>套用 →</button>
    </div>
  </div>

  <div id="sig-saved-row">
    <img id="sig-thumb" src="" alt="簽名">
    <div class="sinfo">
      <strong>簽名已儲存</strong>
      <p>可拖曳到文件任意位置</p>
    </div>
    <button class="re-sign-btn" onclick="reSign()">重新簽名</button>
  </div>
</div>

<!-- ③ 放置 -->
<div class="card" id="card-place">
  <div class="card-title">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
    步驟三｜拖曳簽名到指定位置
  </div>
  <div class="place-hint">✦ 拖曳移動　◎ 右下角縮放　✕ 刪除</div>

  <!-- PDF 多頁選頁器 -->
  <div id="pdf-page-selector">
    <div class="page-sel-title">📄 選擇要簽名的頁面</div>
    <div class="page-tabs" id="page-tabs"></div>
    <div class="page-nav-info" id="page-nav-info"></div>
  </div>

  <div id="doc-place-wrap">
    <img id="doc-place-img" src="" alt="">
    <canvas id="doc-place-pdfcanvas"></canvas>
  </div>
  <div class="place-btn-row">
    <button id="prev-page-btn" onclick="switchPage(-1)" disabled>← 上一頁</button>
    <button id="place-confirm-btn" onclick="goExport()">完成，準備儲存 →</button>
    <button id="next-page-btn" onclick="switchPage(1)" disabled>下一頁 →</button>
  </div>
</div>

<!-- ④ 儲存 -->
<div class="card" id="card-export">
  <div class="card-title">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    步驟四｜儲存簽名後的文件
  </div>
  <div class="export-wrap">
    <div class="export-info" id="export-info-text"><span class="spinner"></span> 合併中，請稍候…</div>
    <canvas id="merge-canvas"></canvas>
    <div id="result-pages-wrap"></div>
    <button class="btn-restart" onclick="location.reload()">↺ 重新開始</button>
  </div>
</div>

</main>
<div id="toast"></div>

<script>
/* ══ 徹底隱藏 PDF.js 在受限瀏覽器產生的所有警告與訊息 ══ */
(function(){
  const origWarn = console.warn;
  const origLog  = console.log;
  const origInfo = console.info;
  const filterPatterns = [
    'fake worker', 'Setting up fake', 'Worker', 'pdf.worker',
    'fetchStandardFontData', 'getDocument', 'pdfjs'
  ];
  function shouldHide(args){
    try {
      const msg = args.map(a => typeof a==='string'?a:(a&&a.message)||'').join(' ');
      return filterPatterns.some(p => msg.indexOf(p) !== -1);
    } catch(e){ return false; }
  }
  console.warn = function(...args){ if(!shouldHide(args)) origWarn.apply(console, args); };
  console.log  = function(...args){ if(!shouldHide(args)) origLog.apply(console, args); };
  console.info = function(...args){ if(!shouldHide(args)) origInfo.apply(console, args); };
})();

/* ══ PDF.js 設定 ══ */
let pdfjsReady = false;
try {
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    // 關閉 PDF.js 內部的 verbosity（額外保險）
    if (pdfjsLib.verbosity !== undefined) pdfjsLib.verbosity = 0;
    pdfjsReady = true;
  }
} catch(e) {}

/* ══ 狀態 ══ */
let penColor='#1a1a2e', penSize=4;
let isDrawing=false, lastX=0, lastY=0;
let sigDataURL=null, docFile=null, isPDF=false;
let docImgDataURL=null;
let pdfPages=[];          // { canvas, dataURL } 每頁資料
let totalPdfPages=0;
let currentPageIdx=0;     // 目前放置簽名的頁碼（0-based）
let pageStickers={};      // { pageIdx: [ sticker資訊... ] } 各頁貼圖
let strokeSnapshots=[];
let points=[], canvasW=0, canvasH=0;

/* ══ 簽名 Canvas ══ */
const canvas = document.getElementById('sig-canvas');
const ctx    = canvas.getContext('2d');

function initCanvas() {
  const rect = canvas.getBoundingClientRect();
  if(!rect.width){setTimeout(initCanvas,100);return;}
  const dpr = window.devicePixelRatio||1;
  canvasW=rect.width*dpr; canvasH=rect.height*dpr;
  canvas.width=canvasW; canvas.height=canvasH;
  ctx.scale(dpr,dpr);
  ctx.lineCap='round'; ctx.lineJoin='round';
  strokeSnapshots=[];
  updateUndoBtn();
}
window.addEventListener('load',initCanvas);
window.addEventListener('resize',()=>setTimeout(initCanvas,200));

function getXY(e,el){
  const r=el.getBoundingClientRect(), s=e.touches?e.touches[0]:e;
  return {x:s.clientX-r.left, y:s.clientY-r.top, t:Date.now()};
}

/* ════════════════════════════════════
   高品質書寫演算法
   - Quadratic Bezier 中點平滑
   - 速度感應筆寬（寫慢→粗、寫快→細）
   - Pointer Events API 壓力感應（支援手寫板）
   - 端點圓潤化
════════════════════════════════════ */
let lastWidth = 0;
const VELOCITY_FILTER = 0.7;
const MIN_WIDTH_RATIO = 0.4;
const MAX_WIDTH_RATIO = 1.8;
let lastPressure = 0.5;  // 壓力值（0~1），無感壓設備預設 0.5

/* ── 從事件取得壓力值 ── */
function getPressure(e){
  // Pointer Events（手寫板）：直接取壓力值
  if(e.pointerType === 'pen' && typeof e.pressure === 'number' && e.pressure > 0){
    return e.pressure;
  }
  // Touch Events（手機手指）：無壓力資訊，回傳預設值
  if(e.touches) return 0.5;
  // Mouse / 無壓力手寫板：回傳預設值
  return 0.5;
}

function startDraw(e){
  e.preventDefault(); isDrawing=true;
  const p=getXY(e,canvas);
  lastPressure = getPressure(e);
  points=[p];
  lastX=p.x; lastY=p.y;
  lastWidth = penSize * MIN_WIDTH_RATIO;
  ctx.fillStyle=penColor;
  ctx.beginPath();
  ctx.arc(p.x, p.y, penSize * lastPressure * 0.6, 0, Math.PI*2);
  ctx.fill();
}

function calcVelocity(p1, p2){
  const dx=p2.x-p1.x, dy=p2.y-p1.y;
  const dt=Math.max(1, p2.t-p1.t);
  return Math.sqrt(dx*dx+dy*dy)/dt;
}

function calcDynamicWidth(velocity, pressure){
  // 速度影響（快→細、慢→粗）
  const velNorm = Math.min(velocity/2.5, 1);
  const velRatio = MAX_WIDTH_RATIO - (MAX_WIDTH_RATIO - MIN_WIDTH_RATIO) * velNorm;
  // 壓力影響（重→粗、輕→細）；無壓力設備 pressure=0.5 維持原始效果
  const pressureRatio = 0.4 + pressure * 1.2;
  // 合併：速度 60%、壓力 40% 權重
  const combinedRatio = velRatio * 0.6 + pressureRatio * 0.4;
  let newWidth = penSize * combinedRatio;
  // 平滑過渡
  newWidth = lastWidth * VELOCITY_FILTER + newWidth * (1-VELOCITY_FILTER);
  lastWidth = newWidth;
  return newWidth;
}

function midPoint(p1, p2){
  return {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
}

function doDraw(e){
  if(!isDrawing)return; e.preventDefault();
  const p=getXY(e,canvas);
  const last=points[points.length-1];
  const dist=Math.hypot(p.x-last.x, p.y-last.y);
  if(dist<1)return;

  // 取得壓力值（手寫板為真實壓力，手指/滑鼠為 0.5）
  const pressure = getPressure(e);
  lastPressure = pressure * 0.3 + lastPressure * 0.7; // 平滑壓力變化

  points.push(p);
  if(points.length<3)return;

  const len=points.length;
  const p0=points[len-3], p1=points[len-2], p2=points[len-1];
  const velocity=calcVelocity(p1,p2);
  const width=calcDynamicWidth(velocity, lastPressure);
  const startMid=midPoint(p0,p1);
  const endMid=midPoint(p1,p2);

  ctx.strokeStyle=penColor;
  ctx.lineWidth=width;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(startMid.x, startMid.y);
  ctx.quadraticCurveTo(p1.x, p1.y, endMid.x, endMid.y);
  ctx.stroke();

  document.getElementById('apply-btn').disabled=false;
}

function endDraw(){
  if(!isDrawing)return; isDrawing=false;
  if(points.length>=2){
    const last=points[points.length-1];
    const prev=points[points.length-2];
    const startMid=midPoint(prev,last);
    ctx.strokeStyle=penColor;
    ctx.lineWidth=lastWidth||penSize;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(startMid.x, startMid.y);
    ctx.lineTo(last.x, last.y);
    ctx.stroke();
    ctx.fillStyle=penColor;
    ctx.beginPath();
    ctx.arc(last.x, last.y, (lastWidth||penSize)*0.45, 0, Math.PI*2);
    ctx.fill();
  } else if(points.length===1){
    const p=points[0];
    ctx.fillStyle=penColor;
    ctx.beginPath();
    ctx.arc(p.x, p.y, penSize*0.5, 0, Math.PI*2);
    ctx.fill();
  }
  points=[];
  lastWidth=0;
  lastPressure=0.5;
  strokeSnapshots.push(ctx.getImageData(0,0,canvasW,canvasH));
  updateUndoBtn();
  document.getElementById('apply-btn').disabled=false;
}

/* ── 事件監聽器 ──
   判斷規則：
   ① 手機（iOS / Android）→ 強制 Touch Events，Pointer Events 完全不啟用
   ② 桌面 PC（含手寫板）  → Pointer Events（支援壓力感應）+ 滑鼠備援
   ③ 無法判斷             → 安全回退至 Touch + Mouse Events
── */

/* 手機判斷：只要是行動裝置就判定為手機，不管有沒有 PointerEvent */
const _ua = navigator.userAgent || '';
const _isIOS     = /iPad|iPhone|iPod/i.test(_ua) && !window.MSStream;
const _isAndroid = /Android/i.test(_ua);
const _isMobile  = _isIOS || _isAndroid ||
                   /Mobile|Tablet|Touch/i.test(_ua) ||
                   (navigator.maxTouchPoints > 1 && /Macintosh/i.test(_ua)); // iPad偽裝Mac

/* 是否為桌面且有 Pointer Events（手寫板壓力感應條件）*/
const _usePointer = !_isMobile && window.PointerEvent;

if(_usePointer){
  /* ══ 桌面 PC + 手寫板：Pointer Events（有壓力感應）══ */
  canvas.addEventListener('pointerdown',  startDraw);
  canvas.addEventListener('pointermove',  doDraw);
  canvas.addEventListener('pointerup',    endDraw);
  canvas.addEventListener('pointerleave', endDraw);
  canvas.addEventListener('pointercancel',endDraw);
  /* 桌面觸控螢幕（Surface 等）：阻止 touch 重複觸發 */
  canvas.addEventListener('touchstart', e=>e.preventDefault(), {passive:false});

} else {
  /* ══ 手機（iOS / Android）：Touch Events（完全不用 Pointer Events）══ */
  canvas.addEventListener('touchstart', startDraw, {passive:false});
  canvas.addEventListener('touchmove',  doDraw,    {passive:false});
  canvas.addEventListener('touchend',   endDraw);
  canvas.addEventListener('touchcancel',endDraw);
  /* 滑鼠備援（避免部分 Android 平板用滑鼠時無反應）*/
  canvas.addEventListener('mousedown',  startDraw);
  canvas.addEventListener('mousemove',  doDraw);
  canvas.addEventListener('mouseup',    endDraw);
  canvas.addEventListener('mouseleave', endDraw);
}

/* ── iOS / Android 系統手勢全面封鎖（CSS + JS 雙層）── */
canvas.style.webkitUserSelect       = 'none';
canvas.style.userSelect             = 'none';
canvas.style.webkitTouchCallout     = 'none';   // 阻止 iOS 長按選單
canvas.style.webkitTapHighlightColor= 'transparent'; // 阻止點擊高亮
canvas.setAttribute('autocomplete', 'off');
canvas.setAttribute('autocorrect',  'off');
canvas.setAttribute('autocapitalize','off');
canvas.setAttribute('spellcheck',   'false');

/* 顯示目前模式（方便除錯，正式使用時不影響功能）*/
console.log('EZSign 輸入模式：' + (_usePointer ? 'Pointer Events（桌面/手寫板）' : 'Touch Events（手機）'));

function undoStroke(){
  if(!strokeSnapshots.length)return;
  strokeSnapshots.pop();
  if(!strokeSnapshots.length){ctx.clearRect(0,0,canvasW,canvasH);document.getElementById('apply-btn').disabled=true;}
  else ctx.putImageData(strokeSnapshots[strokeSnapshots.length-1],0,0);
  updateUndoBtn();
}
function updateUndoBtn(){document.getElementById('undo-btn').disabled=!strokeSnapshots.length;}
function clearSig(){ctx.clearRect(0,0,canvasW,canvasH);strokeSnapshots=[];document.getElementById('apply-btn').disabled=true;updateUndoBtn();}
function setColor(el){document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active'));el.classList.add('active');penColor=el.dataset.color;}
function setSize(el){document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');penSize=parseInt(el.dataset.size);}

/* ══ 上傳文件 ══ */
document.getElementById('file-input').addEventListener('change',function(e){
  const file=e.target.files[0]; if(!file)return; loadFile(file);
});

function loadFile(file){
  docFile=file; pdfPages=[]; pageStickers={};
  isPDF=file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf');
  document.getElementById('file-icon-el').textContent=isPDF?'📕':'🖼️';
  document.getElementById('file-name-el').textContent=file.name;
  document.getElementById('file-size-el').textContent=(file.size/1024).toFixed(1)+' KB';
  document.getElementById('upload-zone').style.display='none';
  document.getElementById('file-chip-row').style.display='flex';
  document.getElementById('doc-preview-box').style.display='flex';
  document.getElementById('doc-preview-img').style.display='none';
  document.getElementById('loading-bar').style.display='none';
  document.getElementById('pdf-pages-wrap').style.display='none';
  document.getElementById('pdf-pages-wrap').innerHTML='';

  const reader=new FileReader();
  if(!isPDF){
    reader.onload=ev=>{
      docImgDataURL=ev.target.result;
      const img=document.getElementById('doc-preview-img');
      img.src=docImgDataURL; img.style.display='block';
      document.getElementById('doc-place-img').src=docImgDataURL;
      document.getElementById('doc-place-img').style.display='block';
      document.getElementById('doc-place-pdfcanvas').style.display='none';
      afterFileLoaded();
    };
    reader.readAsDataURL(file);
  } else {
    // 檢查 PDF.js 是否可用
    if (!pdfjsReady) {
      document.getElementById('loading-bar').style.display='block';
      document.getElementById('loading-bar').innerHTML=
        '⚠ PDF 處理元件未載入<br>'+
        '<small style="color:var(--muted)">請確認網路連線後重新整理頁面，或改用圖片格式</small>';
      return;
    }
    document.getElementById('loading-bar').style.display='block';
    reader.onload=ev=>renderPDF(new Uint8Array(ev.target.result));
    reader.readAsArrayBuffer(file);
  }
}

async function renderPDF(typedArray){
  try{
    const pdf=await pdfjsLib.getDocument({data:typedArray}).promise;
    totalPdfPages=pdf.numPages;
    const previewWrap=document.getElementById('pdf-pages-wrap');
    previewWrap.innerHTML=''; pdfPages=[];

    // 限制最大頁數，避免記憶體問題
    const MAX_PAGES = 20;
    const renderPages = Math.min(totalPdfPages, MAX_PAGES);

    for(let pn=1;pn<=renderPages;pn++){
      const page=await pdf.getPage(pn);

      // 自適應 scale：根據頁面寬度動態調整，避免太大爆記憶體
      const baseViewport = page.getViewport({scale:1});
      const targetW = 1200; // 目標寬度像素
      const scale = Math.min(2, Math.max(1, targetW / baseViewport.width));
      const viewport = page.getViewport({scale});

      const c=document.createElement('canvas');
      c.width=viewport.width; c.height=viewport.height;
      await page.render({canvasContext:c.getContext('2d'),viewport}).promise;

      let dataURL='';
      try { dataURL = c.toDataURL('image/jpeg', 0.85); }
      catch(e){ try { dataURL = c.toDataURL('image/png'); } catch(e2){} }
      pdfPages.push({canvas:c, dataURL});

      // 預覽區塊
      const item=document.createElement('div');
      item.className='pdf-page-item';
      const lbl=document.createElement('div');
      lbl.className='pdf-page-label';
      lbl.textContent=`第 ${pn} 頁 / 共 ${totalPdfPages} 頁`;
      const previewC=document.createElement('canvas');
      previewC.width=c.width; previewC.height=c.height;
      previewC.getContext('2d').drawImage(c,0,0);
      item.appendChild(lbl); item.appendChild(previewC);
      previewWrap.appendChild(item);
    }

    if(totalPdfPages > MAX_PAGES){
      const note=document.createElement('div');
      note.className='pdf-page-label';
      note.style.color='var(--accent)';
      note.textContent=`⚠ 僅處理前 ${MAX_PAGES} 頁，共 ${totalPdfPages} 頁`;
      previewWrap.appendChild(note);
    }

    document.getElementById('loading-bar').style.display='none';
    document.getElementById('pdf-pages-wrap').style.display='flex';
    afterFileLoaded();
  } catch(err){
    console.error('PDF載入錯誤', err);
    document.getElementById('loading-bar').innerHTML='⚠ PDF 載入失敗，請確認檔案未加密或檔案不要太大';
  }
}

function afterFileLoaded(){
  setStep(2);
  showToast('✓ 文件已載入，請確認預覽後往下簽名');
  document.getElementById('go-sign-btn').style.display='block';
  // 捲動到預覽區，讓使用者先確認文件內容
  setTimeout(()=>document.getElementById('doc-preview-box').scrollIntoView({behavior:'smooth',block:'start'}),300);
}

function removeFile(){
  docFile=null; isPDF=false; docImgDataURL=null; pdfPages=[]; pageStickers={};
  document.getElementById('upload-zone').style.display='flex';
  document.getElementById('file-chip-row').style.display='none';
  document.getElementById('doc-preview-box').style.display='none';
  document.getElementById('file-input').value='';
  setStep(1);
}

/* ══ 套用簽名 ══ */
function applySig(){
  const rawData=ctx.getImageData(0,0,canvasW,canvasH);
  let x0=canvasW,y0=canvasH,x1=0,y1=0;
  for(let i=0;i<rawData.data.length;i+=4){
    if(rawData.data[i+3]>10){
      const px=(i/4)%canvasW, py=Math.floor((i/4)/canvasW);
      if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
    }
  }
  const pad=12;
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);
  x1=Math.min(canvasW,x1+pad);y1=Math.min(canvasH,y1+pad);
  const w=x1-x0||canvasW, h=y1-y0||canvasH;
  const crop=document.createElement('canvas');
  crop.width=w; crop.height=h;
  crop.getContext('2d').putImageData(rawData,-x0,-y0);
  sigDataURL=crop.toDataURL('image/png');

  document.getElementById('sig-thumb').src=sigDataURL;
  document.getElementById('sig-saved-row').style.display='flex';

  if(!docFile){showToast('⚠ 請先上傳文件');return;}
  setupPlacePage();
}

function reSign(){
  clearSig();
  document.getElementById('sig-saved-row').style.display='none';
  document.getElementById('card-place').style.display='none';
  document.getElementById('card-export').style.display='none';
  setStep(2);
}

/* ══ 放置頁面設定 ══ */
function setupPlacePage(){
  document.getElementById('card-place').style.display='block';
  currentPageIdx=0;

  // 先把 doc-place-img 的 alt 文字清掉，避免顯示「文件」字樣
  const placeImg = document.getElementById('doc-place-img');
  placeImg.alt = '';

  if(isPDF && pdfPages.length>0){
    // PDF 模式
    document.getElementById('pdf-page-selector').style.display='flex';
    buildPageTabs();
    document.getElementById('prev-page-btn').disabled = (pdfPages.length<=1);
    document.getElementById('next-page-btn').disabled = (pdfPages.length<=1);
    // 隱藏圖片，顯示 PDF canvas
    placeImg.style.display='none';
    placeImg.src='';
    document.getElementById('doc-place-pdfcanvas').style.display='block';
    loadPlacePage(0);
  } else {
    // 圖片模式
    document.getElementById('pdf-page-selector').style.display='none';
    document.getElementById('doc-place-pdfcanvas').style.display='none';
    placeImg.style.display='block';
    if(docImgDataURL) placeImg.src=docImgDataURL;
    document.getElementById('prev-page-btn').disabled=true;
    document.getElementById('next-page-btn').disabled=true;
    // 等圖片載入完畢再放貼圖（確保有正確尺寸）
    if(placeImg.complete){
      initStickersForPage('img');
    } else {
      placeImg.onload = () => initStickersForPage('img');
    }
  }

  setStep(3);
  setTimeout(()=>document.getElementById('card-place').scrollIntoView({behavior:'smooth',block:'start'}),200);
}

function buildPageTabs(){
  const wrap=document.getElementById('page-tabs');
  wrap.innerHTML='';
  for(let i=0;i<pdfPages.length;i++){
    const btn=document.createElement('button');
    btn.className='page-tab'+(i===0?' active':'');
    btn.id=`ptab-${i}`;
    btn.textContent=`第${i+1}頁`;
    btn.onclick=()=>switchToPage(i);
    wrap.appendChild(btn);
  }
  updatePageNavInfo();
}

function updatePageNavInfo(){
  const signed=Object.keys(pageStickers).filter(k=>pageStickers[k]&&pageStickers[k].length>0).length;
  document.getElementById('page-nav-info').textContent=
    `第 ${currentPageIdx+1} 頁 / 共 ${pdfPages.length} 頁　已簽：${signed} 頁`;
}

function switchPage(dir){
  saveCurrentStickers();
  const next=currentPageIdx+dir;
  if(next<0||next>=pdfPages.length)return;
  switchToPage(next);
}

function switchToPage(idx){
  saveCurrentStickers();
  currentPageIdx=idx;
  loadPlacePage(idx);
  document.querySelectorAll('.page-tab').forEach((b,i)=>{
    b.className='page-tab'+(i===idx?' active':'');
    if(pageStickers[i]&&pageStickers[i].length>0) b.classList.add('signed');
  });
  updatePageNavInfo();
}

function loadPlacePage(idx){
  try {
    const pc=document.getElementById('doc-place-pdfcanvas');
    const placeImg=document.getElementById('doc-place-img');
    const src=pdfPages[idx];
    if(!src || !src.dataURL){
      console.warn('PDF頁面資料不存在', idx);
      showToast('⚠ 找不到頁面資料');
      return;
    }

    // 確保顯示狀態正確
    placeImg.style.display='none';
    placeImg.src='';
    pc.style.display='block';

    // 用 Image 載入 dataURL 後繪製，最穩定的方式
    const img=new Image();
    img.onload=function(){
      pc.width=img.width;
      pc.height=img.height;
      const cx=pc.getContext('2d');
      cx.clearRect(0,0,pc.width,pc.height);
      cx.drawImage(img,0,0);

      // 清除舊貼圖
      const wrap=document.getElementById('doc-place-wrap');
      wrap.querySelectorAll('.sig-sticker').forEach(el=>el.remove());

      // 等 DOM 更新完畢再放貼圖
      setTimeout(()=>{
        if(pageStickers[idx] && pageStickers[idx].length>0){
          pageStickers[idx].forEach(info=>restoreSticker(info,wrap));
        } else {
          initStickersForPage(idx);
        }
      },150);
    };
    img.onerror=function(){
      console.error('PDF頁面圖片載入失敗');
      showToast('⚠ 頁面圖片載入失敗');
    };
    img.src=src.dataURL;
  } catch(err){
    console.error('載入頁面失敗', err);
    showToast('⚠ 頁面載入失敗');
  }
}

/* ══ 合成「簽名 + 底層浮水印」貼圖 ══ */
function makeSignatureWithWatermark(sigURL, callback){
  const img = new Image();
  img.onload = function(){
    // 建立合成 canvas：原簽名上方留空、下方加浮水印
    const sigW = img.width;
    const sigH = img.height;

    // 浮水印區域：在簽名下方加一塊
    const wmHeight = Math.max(40, sigH * 0.35); // 浮水印區高度
    const totalH = sigH + wmHeight;

    const c = document.createElement('canvas');
    c.width  = sigW;
    c.height = totalH;
    const cx = c.getContext('2d');

    // 取得今天日期
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    const dateStr = `${y}/${m}/${d}`;

    // 先畫底層浮水印
    const titleSize = Math.max(14, sigW * 0.10);
    const dateSize  = Math.max(11, sigW * 0.08);

    cx.save();
    cx.textAlign = 'right';
    cx.textBaseline = 'bottom';
    // 上方：EZSign
    cx.globalAlpha = 0.85;
    cx.fillStyle = '#8b1a1a';
    cx.font = `bold ${titleSize}px sans-serif`;
    cx.fillText('EZSign', sigW - 8, sigH + wmHeight * 0.55);
    // 下方：日期
    cx.fillStyle = '#333333';
    cx.font = `${dateSize}px sans-serif`;
    cx.fillText(dateStr, sigW - 8, sigH + wmHeight - 4);
    cx.restore();

    // 再畫簽名在上方
    cx.drawImage(img, 0, 0, sigW, sigH);

    callback(c.toDataURL('image/png'));
  };
  img.onerror = () => callback(sigURL);  // 失敗就回傳原始簽名
  img.src = sigURL;
}

function initStickersForPage(pageKey){
  const wrap=document.getElementById('doc-place-wrap');
  wrap.querySelectorAll('.sig-sticker').forEach(el=>el.remove());
  // 合成「簽名 + 浮水印」後再加入
  makeSignatureWithWatermark(sigDataURL, function(combinedURL){
    // 預設尺寸稍微加高（因為下方多了浮水印區）
    addSticker(combinedURL, 20, 20, 140, 95, false, wrap);
  });
}

/* ══ 儲存/還原貼圖位置 ══ */
function saveCurrentStickers(){
  const wrap=document.getElementById('doc-place-wrap');
  const stickers=wrap.querySelectorAll('.sig-sticker');
  const key=isPDF?currentPageIdx:'img';
  pageStickers[key]=[];
  stickers.forEach(st=>{
    pageStickers[key].push({
      src:  st.querySelector('img').src,
      left: parseFloat(st.style.left)||0,
      top:  parseFloat(st.style.top)||0,
      w:    st.offsetWidth,
      h:    st.offsetHeight,
      isDate: st.dataset.isdate==='1'
    });
  });
}

function restoreSticker(info, wrap){
  addSticker(info.src, info.left, info.top, info.w, info.h, info.isDate, wrap);
}

function addSticker(src, left, top, w, h, isDate, wrap){
  if(!wrap) wrap=document.getElementById('doc-place-wrap');
  const s=document.createElement('div');
  s.className='sig-sticker';
  s.dataset.isdate=isDate?'1':'0';
  s.style.cssText=`left:${left}px;top:${top}px;width:${w}px;height:${h}px;`;
  s.innerHTML=`
    <div class="sticker-border${isDate?' date-type':''}"></div>
    <img src="${src}" draggable="false">
    <div class="del-btn">✕</div>
    <div class="resize-btn">⤡</div>`;
  s.querySelector('.del-btn').addEventListener('click',e=>{e.stopPropagation();s.remove();});
  makeDraggable(s,wrap);
  makeResizable(s.querySelector('.resize-btn'),s,wrap);
  wrap.appendChild(s);
}

/* ══ 拖曳 & 縮放 ══ */
function makeDraggable(el,container){
  let sx,sy,ex,ey;
  function down(e){
    if(e.target.classList.contains('del-btn')||e.target.classList.contains('resize-btn'))return;
    e.preventDefault();
    const src=e.touches?e.touches[0]:e;
    sx=src.clientX;sy=src.clientY;ex=el.offsetLeft;ey=el.offsetTop;
    docAdd('mousemove',move);docAdd('mouseup',up);
    docAdd('touchmove',move,{passive:false});docAdd('touchend',up);
  }
  function move(e){
    e.preventDefault();
    const src=e.touches?e.touches[0]:e;
    const cr=container.getBoundingClientRect();
    let nx=ex+(src.clientX-sx),ny=ey+(src.clientY-sy);
    nx=Math.max(0,Math.min(nx,cr.width-el.offsetWidth));
    ny=Math.max(0,Math.min(ny,cr.height-el.offsetHeight));
    el.style.left=nx+'px';el.style.top=ny+'px';
  }
  function up(){docRm('mousemove',move);docRm('mouseup',up);docRm('touchmove',move);docRm('touchend',up);}
  el.addEventListener('mousedown',down);
  el.addEventListener('touchstart',down,{passive:false});
}
function makeResizable(handle,el,container){
  let sx,sy,sw,sh;
  function down(e){
    e.stopPropagation();e.preventDefault();
    const src=e.touches?e.touches[0]:e;
    sx=src.clientX;sy=src.clientY;sw=el.offsetWidth;sh=el.offsetHeight;
    docAdd('mousemove',move);docAdd('mouseup',up);
    docAdd('touchmove',move,{passive:false});docAdd('touchend',up);
  }
  function move(e){
    e.preventDefault();
    const src=e.touches?e.touches[0]:e;
    el.style.width=Math.max(40,sw+(src.clientX-sx))+'px';
    el.style.height=Math.max(20,sh+(src.clientY-sy))+'px';
  }
  function up(){docRm('mousemove',move);docRm('mouseup',up);docRm('touchmove',move);docRm('touchend',up);}
  handle.addEventListener('mousedown',down);
  handle.addEventListener('touchstart',down,{passive:false});
}
function docAdd(ev,fn,opt){document.addEventListener(ev,fn,opt);}
function docRm(ev,fn){document.removeEventListener(ev,fn);}

/* ══ 合併輸出 ══ */
function goExport(){
  saveCurrentStickers();
  document.getElementById('card-export').style.display='block';
  setStep(4);
  setTimeout(()=>document.getElementById('card-export').scrollIntoView({behavior:'smooth',block:'start'}),200);
  setTimeout(mergeAll,600);
}

async function mergeAll(){
  const resultWrap=document.getElementById('result-pages-wrap');
  resultWrap.innerHTML='';

  const wrap=document.getElementById('doc-place-wrap');
  const displayW = wrap.offsetWidth;
  const displayH = wrap.offsetHeight || 400;

  if(!isPDF){
    // 單圖模式：取得原始圖片尺寸
    const realSize = await getImageRealSize(docImgDataURL);
    // 用原始尺寸合併（保持高解析度）
    const dataURL=await mergePage(
      docImgDataURL,
      pageStickers['img']||[],
      realSize.w, realSize.h,
      displayW, displayH
    );
    appendResultPage(resultWrap,dataURL,null);
  } else {
    // PDF 多頁模式
    const signedPages=Object.keys(pageStickers).filter(k=>pageStickers[k]&&pageStickers[k].length>0);
    if(signedPages.length===0){
      document.getElementById('export-info-text').textContent='⚠ 尚未在任何頁面放置簽名';
      return;
    }
    for(const k of signedPages){
      const pageIdx=parseInt(k);
      const pageData = pdfPages[pageIdx];
      const bgURL = pageData.dataURL;
      // PDF 頁面的原始解析度
      const realW = pageData.canvas.width;
      const realH = pageData.canvas.height;
      const dataURL=await mergePage(bgURL,pageStickers[k],realW,realH,displayW,displayH);
      appendResultPage(resultWrap,dataURL,`第 ${pageIdx+1} 頁`);
    }
  }

  document.getElementById('export-info-text').style.display='none';
  resultWrap.style.display='flex';
}

/* 取得圖片真實尺寸 */
function getImageRealSize(url){
  return new Promise(resolve=>{
    const i=new Image();
    i.onload=()=>resolve({w:i.naturalWidth, h:i.naturalHeight});
    i.onerror=()=>resolve({w:800, h:1000});
    i.src=url;
  });
}

function mergePage(bgURL, stickers, W, H, displayW, displayH){
  return new Promise(resolve=>{
    const mc=document.getElementById('merge-canvas');
    mc.width=W; mc.height=H;
    const mctx=mc.getContext('2d');

    // 計算位置縮放比例：把畫面座標轉為實際輸出座標
    const scaleX = W / displayW;
    const scaleY = H / displayH;

    /* 流程：文件背景（原解析度）→ 簽名（含內建浮水印，按比例放大） */
    function drawStickers(){
      let done=0;
      if(!stickers.length){ finalize(); return; }
      stickers.forEach(st=>{
        const si=new Image();
        si.onload=()=>{
          // 把畫面尺寸的位置轉換到實際輸出尺寸
          mctx.drawImage(si,
            st.left * scaleX,
            st.top  * scaleY,
            st.w    * scaleX,
            st.h    * scaleY
          );
          if(++done===stickers.length) finalize();
        };
        si.onerror=()=>{ if(++done===stickers.length) finalize(); };
        si.src=st.src;
      });
    }

    function finalize(){
      let dataURL='';
      try{dataURL=mc.toDataURL('image/jpeg',0.95);}catch(e){}
      if(!dataURL||dataURL==='data:,'){try{dataURL=mc.toDataURL('image/png');}catch(e){}}
      resolve(dataURL||'');
    }

    if(bgURL){
      const bg=new Image();
      bg.onload=()=>{mctx.drawImage(bg,0,0,W,H);drawStickers();};
      bg.onerror=()=>{mctx.fillStyle='#fff';mctx.fillRect(0,0,W,H);drawStickers();};
      bg.src=bgURL;
    } else {
      mctx.fillStyle='#fff';mctx.fillRect(0,0,W,H);drawStickers();
    }
  });
}

function appendResultPage(wrap, dataURL, label){
  const block=document.createElement('div');
  block.className='result-page-block';
  if(label){
    const lbl=document.createElement('div');
    lbl.className='result-page-title';
    lbl.textContent=`📄 ${label}`;
    block.appendChild(lbl);
  }
  const hint=document.createElement('div');
  hint.className='save-hint';
  hint.innerHTML='👇 <strong>長按圖片</strong> → 選「<strong>儲存圖片</strong>」存到相簿';
  block.appendChild(hint);
  const img=document.createElement('img');
  img.className='result-page-img';
  img.src=dataURL;
  img.alt='簽名文件';
  block.appendChild(img);
  wrap.appendChild(block);
}

/* ══ 工具 ══ */
function setStep(n){
  for(let i=1;i<=4;i++){
    const el=document.getElementById('s'+i);
    if(i<n){el.className='step-circle done';el.textContent='✓';}
    else if(i===n){el.className='step-circle active';el.textContent=i;}
    else{el.className='step-circle idle';el.textContent=i;}
  }
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
